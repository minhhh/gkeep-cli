[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gkeep-cli"
version = "0.1.0"
description = "Command line interface for Google Keep notes, checklists, labels, and collaborators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "gkeepapi>=0.17",
    "gpsoauth>=1.1",
    "keyring>=25",
    "typer>=0.15",
]

[project.scripts]
gkeep = "gkeep_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gkeep_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["gkeepapi", "gkeepapi.*", "gpsoauth", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
